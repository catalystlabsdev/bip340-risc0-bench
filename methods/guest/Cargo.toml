[package]
name = "verify_sigs"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
risc0-zkvm = { version = "^3.0.5", default-features = false, features = ['std'] }
k256 = { version = "=0.13.4", default-features = false, features = ["schnorr", "std"] }

# RISC Zero accelerated crates (bigint2 / sha256 precompiles inside the zkVM).
# Pattern taken from risc0/examples/ecdsa/k256 on branch release-3.0.
[patch.crates-io]
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }

[profile.release]
codegen-units = 1
lto = "thin"
